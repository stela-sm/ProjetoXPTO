name: pipeline
on:
  push:
    branches: [main]
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Instalar Dependências
        run: pip install pytest
      - name: Executar Teste de Soma
        run: pytest test_soma.py
      - name: Executar Teste de Subtração
        run: pytest test_subtracao.py
      - name: Executar Teste de Multiplicação
        run: pytest test_multiplicacao.py
      - name: Executar Teste de Divisão
        run: pytest test_divisao.py
  deploy:
    needs: teste
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying application..."
